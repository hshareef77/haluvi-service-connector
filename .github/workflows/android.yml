name: Build and publish Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Haluvi-Service-Connector-test-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Create or update test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0.0-test
          APK=app/build/outputs/apk/debug/app-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Haluvi Service Connector 1.0 test" --notes "Installable debug-signed test APK. Includes installed-app selector, HTTPS saved-session browser, local service profiles and opt-in accessibility control inspection. No universal wallet payment integration; no production signing key." --prerelease
          fi
