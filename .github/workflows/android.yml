name: Build and publish Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Haluvi-Service-Connector-debug-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/*.apk --title "Haluvi Service Connector ${GITHUB_REF_NAME}" --notes "Installable test APK. Debug signing; not a permanent release-signing key. Includes app picker, HTTPS browser, saved profiles, and opt-in accessibility inspection. No third-party payment-provider integration is claimed." --latest
